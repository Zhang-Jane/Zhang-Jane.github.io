# 站点级主题覆盖（恢复升级前自定义的导航与顶图；其余沿用主题默认）
# 文档：https://butterfly.js.org/

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  时间线: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  pdf笔记: /program/nav.html || fas fa-list
  休闲||fas fa-heartbeat||hide:
    听音乐: /music/ || fas fa-music
    演唱会: /concert/ || fas fa-video
  友情链接: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

code_blocks:
  theme: darker
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-github: https://github.com/Zhang-Jane || Github || '#24292e'
  fas fa-envelope: mailto:luckingshine@gmail.com || Email || '#4a7dbe'

# 侧边栏作者卡片「Follow Me」按钮（主题默认为 https://github.com/xxxxxx，需单独覆盖）
aside:
  card_author:
    button:
      link: https://github.com/Zhang-Jane

favicon: /img/hamburger.ico

avatar:
  img: https://img2.baidu.com/it/u=4274118481,3879373441&fm=253&fmt=auto&app=138&f=JPEG?w=400&h=400
  effect: false

disable_top_img: false

# 首页大封面（原配置）
index_img: https://pic2.zhimg.com/v2-24ae9869e03dee51d4ebe9cc6a824264_r.jpg?source=1940ef5c

# 未单独设置 top_img 的页面是否使用默认图；false 表示不强制统一默认图
default_top_img: false

# 归档页顶图（原配置）
archive_img: https://timgsa.baidu.com/timg?image&quality=80&size=b9999_10000&sec=1602308782342&di=9f5e33b598ea1c647fc2385eb2728390&imgtype=0&src=http%3A%2F%2Fattach.bbs.miui.com%2Fforum%2F201303%2F18%2F233119quyrec7to3ws3rco.jpg

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover: /extra_imgs/town.jpg

error_img:
  flink: /img/unfind.jpg
  post_page: /img/unfind.jpg

search:
  use: local_search
  placeholder:
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

# Meting / APlayer（与根目录 _config.yml 中 aplayer 配置配合；见主题文档）
aplayerInject:
  enable: true
  per_page: true

# 自定义注入（主题 5.x 仍为 head / bottom 列表）
inject:
  head:
    - '<style type="text/css">#toggle-sidebar { bottom: 80px; }</style>'
  bottom:
    - '<div class="aplayer no-destroy" data-id="43049" data-server="netease" data-type="album" data-fixed="true" data-mini="true" data-listFolded="false" data-order="random" data-preload="none" data-autoplay="false" muted></div>'
